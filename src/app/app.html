<div class="sky-container"
     [class.morning]="timeOfDay() === 'morning'"
     [class.evening]="timeOfDay() === 'evening'"
     [class.night]="timeOfDay() === 'night'">

  <div class="sun" [hidden]="timeOfDay() === 'night'" [class.setting]="timeOfDay() === 'evening'"></div>
  <div class="moon" [hidden]="timeOfDay() !== 'night'"></div>
  <div class="stars" [hidden]="timeOfDay() !== 'night'"></div>

  <div class="section day-time">
    <div class="time numbers">{{ currentTime() }}</div>
    <div class="date">{{ currentGregDateAr() }} - {{ currentHijriDateAr() }}</div>
  </div>

  <div class="section week">
    @for (day of days(); track $index) {
      <div class="day" [class.current]="day['id']?.toLowerCase() === currentDayOfWeek()" [id]="day['id']">{{ day['name'] }}</div>
    }
  </div>

  <div class="section prayers">
    @for (prayer of prayers(); track $index) {
      <div class="prayer"
           [class.current]="currentPrayerId() === prayer.id">
        <div class="name">{{ prayer.name }}</div>
        <div class="time numbers" [id]="prayer.id">{{ prayer.time }}</div>
      </div>
    }
  </div>

<!--  <div class="section next-prayer">-->
<!--    <div class="col">-->
<!--      {{ nextPrayerName() }}-->
<!--      بعد :-->
<!--      {{ timeLeft()?.text }}-->
<!--    </div>-->
<!--    <div class="col">-->
<!--      <div class="progress-bar">-->
<!--        <div class="progress-bar-fill" [style.width.%]="100 - percentageOfTimeLeft()"></div>-->
<!--      </div>-->
<!--    </div>-->
<!--    <div class="col">-->
<!--      من-->
<!--      {{ totalTimeLeft()?.text }}-->
<!--    </div>-->
<!--  </div>-->

  <div class="section city no-container">
    <select [(ngModel)]="currentCity" (change)="onCityChange($event)">
      <option selected disabled>اختار المدينة</option>
      @for (city of cities(); track $index) {
        <option [value]="city['id']">{{ city['name'] }}</option>
      }
    </select>
  </div>
</div>
